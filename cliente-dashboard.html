<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Toque+ | Painel do cliente</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    :root{
      --bg:#11131C;
      --panel:rgba(31,34,49,.68);
      --line:rgba(255,255,255,.15);
      --text:#fff;
      --muted:rgba(255,255,255,.76);
      --purple:#7B61FF;
      --cyan:#00E5FF;
}
    body{
      margin:0;
      min-height:100vh;
      padding:24px;
      background:
  radial-gradient(circle at 10% 0%, rgba(123,97,255,.22), transparent 34%),
  radial-gradient(circle at 90% 15%, rgba(0,229,255,.16), transparent 30%),
  radial-gradient(circle at 50% 100%, rgba(123,97,255,.10), transparent 35%),
  var(--bg);
      color:var(--text);
      font-family:Arial,sans-serif;
    }

    .container{
      width:100%;
      max-width:1000px;
      margin:0 auto;
    }

    /* TOPO */

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:32px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand img{
      width:42px;
      height:42px;
      object-fit:contain;
    }

    .brand strong{
      font-size:20px;
    }

    .logout{
      border:1px solid var(--line);
      border-radius:11px;
      padding:10px 16px;
      background:rgba(255,255,255,.045);
      color:#fff;
      cursor:pointer;
      transition:.2s ease;
    }

    .logout:hover{
      background:rgba(255,255,255,.09);
      transform:translateY(-1px);
    }

    /* CABEÇALHO */

    .welcome{
      margin-bottom:28px;
    }

    .eyebrow{
      margin:0 0 8px;
      color:var(--cyan);
      font-size:12px;
      font-weight:700;
      letter-spacing:.10em;
      text-transform:uppercase;
    }

    h1{
      margin:0 0 8px;
      font-size:32px;
      line-height:1.15;
    }

    .description{
      margin:0;
      color:var(--muted);
      font-size:15px;
    }

    /* UNIDADE */

    .unit-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:24px;
      padding:20px 22px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--panel);
      backdrop-filter:blur(20px);
    }

    .unit-label{
      display:block;
      margin-bottom:6px;
      color:var(--muted);
      font-size:13px;
    }

    .unit-code{
      font-size:22px;
      font-weight:700;
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(0,229,255,.08);
      border:1px solid rgba(0,229,255,.16);
      color:#9ff6ff;
      font-size:13px;
      font-weight:600;
    }

    .status-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#00E5FF;
      box-shadow:0 0 10px rgba(0,229,255,.8);
    }

    /* MÉTRICAS */

    .section-title{
      margin:0 0 14px;
      font-size:18px;
    }

    .metrics{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .metric{
      position:relative;
      overflow:hidden;
      padding:20px;
      min-height:140px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--panel);
      backdrop-filter:blur(20px);
      transition:.25s ease;
    }

    .metric:hover{
      transform:translateY(-2px);
      border-color:rgba(123,97,255,.30);
      box-shadow:0 14px 35px rgba(0,0,0,.20);
    }

    .metric::after{
      content:"";
      position:absolute;
      width:100px;
      height:100px;
      right:-50px;
      bottom:-50px;
      border-radius:50%;
      background:rgba(123,97,255,.12);
      filter:blur(25px);
    }

    .metric-icon{
      font-size:20px;
      margin-bottom:16px;
    }

    .metric-label{
      display:block;
      color:var(--muted);
      font-size:13px;
      margin-bottom:7px;
    }

    .metric-value{
      font-size:30px;
      font-weight:700;
      line-height:1;
    }

    /* MENSAGEM */

    #mensagem{
      margin-top:20px;
      color:var(--muted);
      font-size:14px;
    }

    /* MOBILE */

    @media(max-width:700px){

      body{
        padding:16px;
      }

      .metrics{
        grid-template-columns:repeat(2,1fr);
      }

      h1{
        font-size:27px;
      }

    }

    @media(max-width:450px){

      .topbar{
        align-items:flex-start;
      }

      .brand strong{
        font-size:18px;
      }

      .unit-card{
        align-items:flex-start;
        flex-direction:column;
      }

      .metrics{
        grid-template-columns:1fr;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <header class="topbar">

      <div class="brand">

        <img
          src="/logo-toque.png"
          alt="Toque+"
        >

        <strong>Toque+</strong>

      </div>

      <button
        class="logout"
        id="logout"
      >
        Sair
      </button>

    </header>


    <section class="welcome">

      <p class="eyebrow">
        Painel do cliente
      </p>

      <h1 id="nomeCliente">
        Carregando...
      </h1>

      <p
        class="description"
        id="descricao"
      >
        Buscando seus dados...
      </p>

    </section>


    <section class="unit-card">

      <div>

        <span class="unit-label">
          Unidade Toque+
        </span>

        <span
          class="unit-code"
          id="unidade"
        >
          ...
        </span>

      </div>

      <div class="status">

        <span class="status-dot"></span>

        <span id="statusUnidade">
          ...
        </span>

      </div>

    </section>


    <section>

      <h2 class="section-title">
        Visão geral
      </h2>


      <div class="metrics">

        <div class="metric">

          <div class="metric-icon">
            👁️
          </div>

          <span class="metric-label">
            Visualizações
          </span>

          <div
            class="metric-value"
            id="views"
          >
            —
          </div>

        </div>


        <div class="metric">

          <div class="metric-icon">
            💬
          </div>

          <span class="metric-label">
            WhatsApp
          </span>

          <div
            class="metric-value"
            id="whatsapp"
          >
            —
          </div>

        </div>


        <div class="metric">

          <div class="metric-icon">
            📸
          </div>

          <span class="metric-label">
            Instagram
          </span>

          <div
            class="metric-value"
            id="instagram"
          >
            —
          </div>

        </div>


        <div class="metric">

          <div class="metric-icon">
            ⭐
          </div>

          <span class="metric-label">
            Google
          </span>

          <div
            class="metric-value"
            id="google"
          >
            —
          </div>

        </div>


        <div class="metric">

          <div class="metric-icon">
            📍
          </div>

          <span class="metric-label">
            Maps
          </span>

          <div
            class="metric-value"
            id="maps"
          >
            —
          </div>

        </div>


        <div class="metric">

          <div class="metric-icon">
            🌐
          </div>

          <span class="metric-label">
            Site
          </span>

          <div
            class="metric-value"
            id="site"
          >
            —
          </div>

        </div>

      </div>

    </section>


    <div id="mensagem"></div>

  </div>


  <script>

    const SUPABASE_URL =
      'https://snihyrudiyuslimhlkvq.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_sebHe5m45BFJGvTnp3N51A_0wveqQLr';

    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const nomeCliente =
      document.getElementById('nomeCliente');

    const descricao =
      document.getElementById('descricao');

    const unidade =
      document.getElementById('unidade');

    const statusUnidade =
      document.getElementById('statusUnidade');

    const mensagem =
      document.getElementById('mensagem');


    const metricElements = {

      visualizacao:
        document.getElementById('views'),

      whatsapp:
        document.getElementById('whatsapp'),

      instagram:
        document.getElementById('instagram'),

      google:
        document.getElementById('google'),

      maps:
        document.getElementById('maps'),

      site:
        document.getElementById('site')

    };


    async function carregarPainel(){

      mensagem.textContent =
        'Carregando dados...';


      /*
       * 1. Verifica o usuário logado
       */

      const {
        data: { user },
        error: authError
      } = await sb.auth.getUser();


      if(authError || !user){

        window.location.href =
          '/cliente.html';

        return;

      }


      console.log(
        'Usuário autenticado:',
        user.id
      );


      /*
       * 2. Busca o cliente ligado
       *    ao usuário autenticado
       */

      const {
        data: cliente,
        error: clienteError
      } = await sb
        .from('clientes')
        .select(`
          id,
          nome,
          descricao,
          usuario_id,
          unidades (
            id,
            codigo,
            status
          )
        `)
        .eq('usuario_id', user.id)
        .maybeSingle();


      if(clienteError){

        console.error(
          'Erro ao buscar cliente:',
          clienteError
        );

        mensagem.textContent =
          'Não foi possível carregar os dados do cliente.';

        return;

      }


      if(!cliente){

        mensagem.textContent =
          'Este usuário não está vinculado a um cliente.';

        return;

      }


      console.log(
        'Cliente encontrado:',
        cliente
      );


      /*
       * 3. Mostra os dados do cliente
       */

      nomeCliente.textContent =
        cliente.nome ||
        'Cliente Toque+';


      descricao.textContent =
        cliente.descricao ||
        'Sua área exclusiva Toque+.';


      /*
       * 4. Identifica a unidade
       */

      const unidadeCliente =
        Array.isArray(cliente.unidades)
          ? cliente.unidades[0]
          : cliente.unidades;


      if(!unidadeCliente){

        unidade.textContent =
          'Nenhuma';

        statusUnidade.textContent =
          'Sem unidade';

        mensagem.textContent =
          'Nenhuma unidade vinculada a este cliente.';

        return;

      }


      unidade.textContent =
        unidadeCliente.codigo;


      statusUnidade.textContent =
        unidadeCliente.status;


      /*
       * 5. Busca os acessos dessa unidade
       */

      const {
        data: acessos,
        error: acessosError
      } = await sb
        .from('acessos')
        .select('tipo')
        .eq(
          'unidade_id',
          unidadeCliente.id
        );


      if(acessosError){

        console.error(
          'Erro ao buscar métricas:',
          acessosError
        );

        mensagem.textContent =
          'Não foi possível carregar as métricas.';

        return;

      }


      /*
       * 6. Conta cada tipo de acesso
       */

      const contagem = {

        visualizacao:0,
        whatsapp:0,
        instagram:0,
        google:0,
        maps:0,
        site:0

      };


      for(const acesso of acessos || []){

        if(
          Object.prototype.hasOwnProperty.call(
            contagem,
            acesso.tipo
          )
        ){

          contagem[acesso.tipo]++;

        }

      }


      /*
       * 7. Atualiza os números
       */

      for(const tipo in metricElements){

        metricElements[tipo].textContent =
          contagem[tipo];

      }


      mensagem.textContent =
        'Dados atualizados.';

    }


    /*
     * Logout
     */

    document
      .getElementById('logout')
      .addEventListener(
        'click',
        async () => {

          await sb.auth.signOut();

          window.location.href =
            '/cliente.html';

        }
      );


    carregarPainel();

  </script>

</body>
</html>
