<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Toque+ | Teste de QR Code</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root{
      --bg:#0A0B10;
      --panel:rgba(18,20,31,.72);
      --line:rgba(255,255,255,.12);
      --text:#fff;
      --muted:rgba(255,255,255,.62);
      --purple:#7B61FF;
      --cyan:#00E5FF;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 20%,rgba(123,97,255,.22),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(0,229,255,.14),transparent 35%),
        var(--bg);
    }

    .card{
      width:100%;
      max-width:430px;
      padding:28px;
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--panel);
      backdrop-filter:blur(18px);
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    h1{
      margin:0 0 8px;
      font-size:24px;
    }

    .subtitle{
      margin:0 0 24px;
      color:var(--muted);
      font-size:14px;
    }

    .unit{
      display:inline-flex;
      padding:8px 14px;
      margin-bottom:22px;
      border-radius:999px;
      background:rgba(123,97,255,.15);
      border:1px solid rgba(123,97,255,.35);
      color:#dcd5ff;
      font-weight:700;
    }

    #qrcode{
      width:260px;
      height:260px;
      margin:0 auto 24px;
      padding:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      border-radius:18px;
    }

    #qrcode img,
    #qrcode canvas{
      max-width:100%;
      max-height:100%;
    }

    .url{
      margin-bottom:22px;
      padding:12px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      color:var(--muted);
      font-size:12px;
      word-break:break-all;
    }

    .button{
      display:block;
      width:100%;
      padding:14px;
      border:0;
      border-radius:14px;
      background:linear-gradient(135deg,var(--purple),var(--cyan));
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .button:active{
      transform:scale(.98);
    }

    .status{
      margin-top:16px;
      color:var(--muted);
      font-size:13px;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Teste de QR Code</h1>

    <p class="subtitle">
      Simulação da plaquinha Toque+
    </p>

    <div class="unit">
      Unidade A001
    </div>

    <div id="qrcode"></div>

    <div class="url" id="url"></div>

    <button class="button" onclick="abrirPagina()">
      Testar página A001
    </button>

    <div class="status">
      Aponte a câmera do celular para o QR Code.
    </div>

  </main>

  <script>

    const url = new URL(
      '/q/A001',
      window.location.origin
    ).href;

    document.getElementById('url').textContent = url;

    new QRCode(
      document.getElementById('qrcode'),
      {
        text:url,
        width:230,
        height:230,
        correctLevel:QRCode.CorrectLevel.H
      }
    );

    function abrirPagina(){
      window.location.href = url;
    }

  </script>

</body>
</html>
